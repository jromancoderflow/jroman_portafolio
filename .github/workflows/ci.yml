name: Build and Deploy Nuxt QA

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/coderflowcl/nuxt_app_front:${{ github.sha }}
            ghcr.io/coderflowcl/nuxt_app_front:qa
          build-args: |
            NUXT_PUBLIC_SITE_URL=${{ secrets.SITE_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.QA_DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 15291
          script: |
            set -e

            APP_DIR=coderflow_apps/nuxt_app_front
            CONTAINER_NAME=nuxt_app_front
            IMAGE=ghcr.io/coderflowcl/nuxt_app_front:qa

            mkdir -p $APP_DIR
            cd $APP_DIR

            docker pull $IMAGE

            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true

            docker run -d \
              --name $CONTAINER_NAME \
              --network caddy-net \
              --restart unless-stopped \
              $IMAGE

            docker system prune -af